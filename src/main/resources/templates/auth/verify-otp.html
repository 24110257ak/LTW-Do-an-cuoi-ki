<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <title>Xác Thực OTP Email - ESC</title>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="navbar-brand-esc text-primary text-decoration-none fs-2">
                    <i class="fa-solid fa-bolt text-warning me-2"></i>ESC<span class="text-warning">.STORE</span>
                </a>
                <p class="text-muted small mt-1">Xác thực mã OTP để kích hoạt tài khoản</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                <div th:if="${successMessage}" class="alert alert-success small p-2 mb-3" role="alert">
                    <i class="fa-solid fa-circle-check me-1"></i><span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger small p-2 mb-3" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i><span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/auth/verify-otp}" method="post" th:object="${verifyOtpRequest}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Email nhận mã OTP:</label>
                        <input type="email" th:field="*{email}" class="form-control" required readonly>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Nhập mã OTP (6 chữ số):</label>
                        <input type="text" th:field="*{otpCode}" class="form-control form-control-lg text-center letter-spacing-2 fw-bold"
                               maxlength="6" required placeholder="••••••" autofocus style="letter-spacing: 8px; font-size: 1.5rem;">
                        <small class="text-muted text-center d-block mt-2">Mã OTP có hiệu lực trong vòng 5 phút.</small>
                        <div class="alert alert-info py-2 px-3 small mt-2 mb-0 border-0 bg-info-subtle text-info-emphasis rounded-3 text-center">
                            <i class="fa-solid fa-terminal me-1"></i> <strong>Dev / Terminal Mode:</strong> Mã OTP đã được in tại <strong>Terminal (Console)</strong> của máy chủ!
                        </div>
                    </div>

                    <button type="submit" class="btn btn-esc w-100 py-2 rounded-pill fw-bold shadow-sm mb-3">
                        <i class="fa-solid fa-shield-check me-2"></i> XÁC NHẬN KÍCH HOẠT
                    </button>
                </form>

                <div class="text-center small text-secondary">
                    Chưa nhận được mã?
                    <a th:href="@{/auth/resend-otp(email=*{email})}" class="fw-bold text-primary text-decoration-none">Gửi lại mã OTP</a>
                </div>
            </div>

            <div class="text-center">
                <a th:href="@{/auth/login}" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
