<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <title>Đặt Lại Mật Khẩu - ESC</title>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="navbar-brand-esc text-primary text-decoration-none fs-2">
                    <i class="fa-solid fa-bolt text-warning me-2"></i>ESC<span class="text-warning">.STORE</span>
                </a>
                <p class="text-muted small mt-1">Nhập mã OTP và tạo mật khẩu mới</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                <div th:if="${successMessage}" class="alert alert-success small p-2 mb-3" role="alert">
                    <i class="fa-solid fa-circle-check me-1"></i><span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger small p-2 mb-3" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i><span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/auth/reset-password}" method="post" th:object="${resetPasswordRequest}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Email nhận mã OTP:</label>
                        <input type="email" th:field="*{email}" class="form-control" required readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Mã xác thực OTP (6 chữ số):</label>
                        <input type="text" th:field="*{otpCode}" class="form-control text-center fw-bold" maxlength="6" required placeholder="••••••" style="letter-spacing: 6px;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Mật khẩu mới *</label>
                        <input type="password" th:field="*{newPassword}" class="form-control" required placeholder="Tối thiểu 6 ký tự">
                    </div>

                    <button type="submit" class="btn btn-esc w-100 py-2 rounded-pill fw-bold shadow-sm">
                        <i class="fa-solid fa-key me-2"></i> ĐẶT LẠI MẬT KHẨU
                    </button>
                </form>
            </div>

            <div class="text-center">
                <a th:href="@{/auth/login}" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
