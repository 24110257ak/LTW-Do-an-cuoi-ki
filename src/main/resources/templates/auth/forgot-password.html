<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <title>Quên Mật Khẩu - ESC</title>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="navbar-brand-esc text-primary text-decoration-none fs-2">
                    <i class="fa-solid fa-bolt text-warning me-2"></i>ESC<span class="text-warning">.STORE</span>
                </a>
                <p class="text-muted small mt-1">Lấy lại mật khẩu thông qua mã OTP Email</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                <div th:if="${errorMessage}" class="alert alert-danger small p-2 mb-3" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i><span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/auth/forgot-password}" method="post">
                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Nhập địa chỉ Email đăng ký tài khoản:</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control border-start-0" required placeholder="email@gmail.com">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-esc w-100 py-2 rounded-pill fw-bold shadow-sm">
                        <i class="fa-solid fa-paper-plane me-2"></i> GỬI MÃ OTP ĐẶT LẠI MẬT KHẨU
                    </button>
                </form>
            </div>

            <div class="text-center">
                <a th:href="@{/auth/login}" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
