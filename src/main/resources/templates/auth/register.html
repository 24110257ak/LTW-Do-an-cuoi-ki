<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <title>Đăng Ký Tài Khoản - ESC Electronics</title>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="navbar-brand-esc text-primary text-decoration-none fs-2">
                    <i class="fa-solid fa-bolt text-warning me-2"></i>ESC<span class="text-warning">.STORE</span>
                </a>
                <p class="text-muted small mt-1">Đăng ký thành viên - Nhận mã OTP kích hoạt qua Email</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                <div th:if="${errorMessage}" class="alert alert-danger small p-2 mb-3" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i><span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Họ và tên *</label>
                        <input type="text" th:field="*{fullName}" class="form-control" required placeholder="Nguyễn Văn A">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Tên đăng nhập *</label>
                        <input type="text" th:field="*{username}" class="form-control" required placeholder="nguyenvana">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Địa chỉ Email *</label>
                        <input type="email" th:field="*{email}" class="form-control" required placeholder="nguyenvana@gmail.com">
                        <small class="text-muted" style="font-size: 0.75rem;">Mã OTP kích hoạt sẽ được gửi tới email này.</small>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Số điện thoại:</label>
                        <input type="tel" th:field="*{phone}" class="form-control" placeholder="0901234567">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Mật khẩu *</label>
                        <input type="password" th:field="*{password}" class="form-control" required placeholder="Tối thiểu 6 ký tự">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <button type="submit" class="btn btn-esc w-100 py-2 rounded-pill fw-bold shadow-sm">
                        <i class="fa-solid fa-user-plus me-2"></i> ĐĂNG KÝ TÀI KHOẢN
                    </button>
                </form>

                <div class="text-center mt-4 small text-secondary">
                    Đã có tài khoản? <a th:href="@{/auth/login}" class="fw-bold text-primary text-decoration-none">Đăng nhập</a>
                </div>
            </div>

            <div class="text-center">
                <a th:href="@{/}" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang chủ</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
