<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hộp thư tư vấn | TechChain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>

<body class="bg-light">
    <div class="d-flex">
        <div th:replace="~{fragments/admin-sidebar :: sidebar('staff-chat')}"></div>
        <main class="flex-grow-1" style="min-width:0">
            <div th:replace="~{fragments/admin-sidebar :: topbar}"></div>
            <div class="container-fluid p-3 p-lg-4">
                <h3 class="fw-bold">Hộp thư tư vấn</h3>
                <p class="text-secondary">Tiếp nhận khách hàng, trả lời và theo dõi các cuộc trò chuyện của chi nhánh.
                </p>
                <div th:replace="~{fragments/chat :: panel(true)}"></div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/chat.js}" defer></script>
</body>

</html>
