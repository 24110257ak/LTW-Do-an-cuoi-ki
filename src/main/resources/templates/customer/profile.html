<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <title>Hồ Sơ Cá Nhân - ESC</title>
</head>
<body>
<div th:replace="~{fragments/header :: header-nav}"></div>

<div class="container my-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page">Hồ sơ cá nhân</li>
        </ol>
    </nav>

    <!-- Flash message -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Col 1: Thông tin cá nhân -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="text-center mb-4">
                    <div class="d-inline-flex justify-content-center align-items-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 80px; height: 80px;">
                        <i class="fa-solid fa-user fs-1"></i>
                    </div>
                    <h5 class="fw-bold mb-1" th:text="${user.fullName}">Tên người dùng</h5>
                    <span class="badge bg-primary px-3 py-1 rounded-pill" th:text="${user.role.roleName}">CUSTOMER</span>
                </div>

                <form th:action="@{/profile/update}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Tên đăng nhập:</label>
                        <input type="text" class="form-control bg-light" th:value="${user.username}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Địa chỉ Email:</label>
                        <input type="email" class="form-control bg-light" th:value="${user.email}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Họ và tên *</label>
                        <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Số điện thoại:</label>
                        <input type="tel" name="phone" class="form-control" th:value="${user.phone}">
                    </div>
                    <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-bold">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thay đổi
                    </button>
                </form>
            </div>
        </div>

        <!-- Col 2: Sổ địa chỉ nhận hàng đa điểm (Yêu cầu đề bài) -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0"><i class="fa-solid fa-map-location-dot text-primary me-2"></i>Sổ Địa Chỉ Giao Hàng</h5>
                    <button type="button" class="btn btn-outline-primary btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#addAddressModal">
                        <i class="fa-solid fa-plus me-1"></i> Thêm địa chỉ mới
                    </button>
                </div>

                <div th:if="${addresses != null && !addresses.isEmpty()}" class="d-flex flex-column gap-3">
                    <div class="border rounded-3 p-3 bg-light" th:each="addr : ${addresses}">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <strong th:text="${addr.receiverName}">Người nhận</strong>
                                <span class="text-muted ms-2 small" th:text="${addr.phone}">0901234567</span>
                            </div>
                            <span th:if="${addr.isDefault}" class="badge bg-success">Mặc định</span>
                        </div>
                        <p class="small text-secondary mb-0">
                            <i class="fa-solid fa-location-dot me-1 text-danger"></i>
                            <span th:text="${addr.street + ', ' + addr.ward + ', ' + addr.district + ', ' + addr.province}">Địa chỉ</span>
                        </p>
                    </div>
                </div>

                <div th:unless="${addresses != null && !addresses.isEmpty()}" class="text-center py-4 text-muted small">
                    <i class="fa-solid fa-location-dot fs-2 mb-2"></i>
                    <div>Bạn chưa lưu địa chỉ nhận hàng nào. Hãy thêm địa chỉ để thanh toán nhanh hơn!</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Thêm địa chỉ mới -->
<div class="modal fade" id="addAddressModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content rounded-4 border-0">
            <form th:action="@{/profile/address/add}" method="post">
                <div class="modal-header">
                    <h6 class="modal-title fw-bold">Thêm Địa Chỉ Nhận Hàng Mới</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Tên người nhận *</label>
                        <input type="text" name="receiverName" class="form-control" required placeholder="Nguyễn Văn A">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Số điện thoại *</label>
                        <input type="tel" name="phone" class="form-control" required placeholder="0901234567">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Tỉnh / Thành phố *</label>
                        <input type="text" name="province" class="form-control" value="TP. Hồ Chí Minh" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Quận / Huyện *</label>
                        <input type="text" name="district" class="form-control" required placeholder="Quận 1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Phường / Xã *</label>
                        <input type="text" name="ward" class="form-control" required placeholder="Phường Bến Nghé">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Địa chỉ chi tiết (Số nhà, tên đường) *</label>
                        <input type="text" name="street" class="form-control" required placeholder="12 Lê Lợi">
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="isDefault" value="true" id="checkDefault">
                        <label class="form-check-label small" for="checkDefault">Đặt làm địa chỉ nhận hàng mặc định</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Lưu địa chỉ</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
