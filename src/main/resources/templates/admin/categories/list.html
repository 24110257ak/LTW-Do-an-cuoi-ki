<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục ngành hàng | TechChain HQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('categories')}"></div>

    <!-- Main Content -->
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/admin-sidebar :: topbar}"></div>

        <div class="container-fluid p-4">
            <!-- Alert message -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Thành công</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1">Quản lý Ngành hàng (Categories)</h3>
                    <p class="text-muted mb-0">Cấu trúc phân loại sản phẩm điện thoại, laptop, phụ kiện toàn hệ thống</p>
                </div>
                <div>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                        <i class="bi bi-plus-lg me-1"></i> Thêm ngành hàng mới
                    </button>
                </div>
            </div>

            <!-- Categories Table -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Tên ngành hàng</th>
                                    <th>Đường dẫn (Slug)</th>
                                    <th>Biểu tượng (Icon)</th>
                                    <th>Thứ tự hiển thị</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${categories == null || categories.isEmpty()}">
                                    <td colspan="7" class="text-center py-5 text-muted">Chưa có danh mục nào.</td>
                                </tr>
                                <tr th:each="cat : ${categories}">
                                    <td th:text="${cat.categoryId}">1</td>
                                    <td>
                                        <strong class="text-dark" th:text="${cat.categoryName}">Điện thoại</strong>
                                    </td>
                                    <td>
                                        <code class="text-primary" th:text="${cat.slug}">dien-thoai</code>
                                    </td>
                                    <td>
                                        <i th:class="${cat.iconUrl != null ? cat.iconUrl : 'bi bi-folder'}" class="fs-5 text-secondary"></i>
                                    </td>
                                    <td th:text="${cat.displayOrder}">1</td>
                                    <td>
                                        <form th:action="@{/admin/categories/{id}/toggle(id=${cat.categoryId})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm border-0 p-0" title="Bấm để bật/tắt">
                                                <span th:if="${cat.isActive}" class="badge bg-success"><i class="bi bi-check-circle me-1"></i> Hoạt động</span>
                                                <span th:if="${!cat.isActive}" class="badge bg-secondary"><i class="bi bi-x-circle me-1"></i> Đã ẩn</span>
                                            </button>
                                        </form>
                                    </td>
                                    <td class="text-end">
                                        <button type="button" class="btn btn-outline-primary btn-sm"
                                                data-bs-toggle="modal" th:data-bs-target="'#editCategoryModal' + ${cat.categoryId}">
                                            <i class="bi bi-pencil-square"></i> Sửa
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal Thêm Ngành Hàng -->
<div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Thêm Ngành hàng mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/categories/save}" th:object="${newCategory}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên ngành hàng <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{categoryName}" class="form-control" placeholder="Ví dụ: Thiết bị đeo thông minh..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Đường dẫn Slug (Tùy chọn)</label>
                        <input type="text" th:field="*{slug}" class="form-control" placeholder="thiet-bi-deo-thong-minh">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Icon Bootstrap (Tùy chọn)</label>
                        <input type="text" th:field="*{iconUrl}" class="form-control" placeholder="bi bi-smartwatch">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Thứ tự hiển thị</label>
                        <input type="number" th:field="*{displayOrder}" class="form-control" value="0">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary fw-bold">Lưu ngành hàng</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
