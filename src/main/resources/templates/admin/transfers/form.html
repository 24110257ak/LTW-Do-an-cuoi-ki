<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo phiếu điều chuyển kho | TechChain HQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('transfers')}"></div>

    <!-- Main Content -->
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/admin-sidebar :: topbar}"></div>

        <div class="container-fluid p-4">
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Lỗi</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Breadcrumb & Header -->
            <div class="mb-4">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/admin/transfers}">Điều chuyển kho</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Tạo phiếu mới</li>
                    </ol>
                </nav>
                <h3 class="fw-bold mb-1">Tạo Phiếu Điều chuyển Kho Liên Chi nhánh</h3>
                <p class="text-muted mb-0">Hệ thống sẽ kiểm tra tồn kho tại chi nhánh nguồn trước khi khởi tạo phiếu</p>
            </div>

            <!-- Form Card -->
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-3">
                        <div class="card-body p-4">
                            <form th:action="@{/admin/transfers/create}" method="post">
                                <div class="row g-3">
                                    <!-- Kho nguồn -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">
                                            <i class="bi bi-box-arrow-up text-danger me-1"></i> Chi nhánh xuất hàng (Nguồn) <span class="text-danger">*</span>
                                        </label>
                                        <select name="sourceBranchId" class="form-select" required>
                                            <option value="">-- Chọn chi nhánh xuất --</option>
                                            <option th:each="b : ${branches}" th:value="${b.branchId}"
                                                    th:text="${b.branchName} + ' (' + ${b.district} + ')'"></option>
                                        </select>
                                    </div>

                                    <!-- Kho đích -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">
                                            <i class="bi bi-box-arrow-in-down text-success me-1"></i> Chi nhánh nhận hàng (Đích) <span class="text-danger">*</span>
                                        </label>
                                        <select name="destinationBranchId" class="form-select" required>
                                            <option value="">-- Chọn chi nhánh nhận --</option>
                                            <option th:each="b : ${branches}" th:value="${b.branchId}"
                                                    th:text="${b.branchName} + ' (' + ${b.district} + ')'"></option>
                                        </select>
                                    </div>

                                    <!-- Sản phẩm cần chuyển -->
                                    <div class="col-md-8">
                                        <label class="form-label fw-semibold">
                                            <i class="bi bi-cpu text-primary me-1"></i> Sản phẩm / Biến thể luân chuyển <span class="text-danger">*</span>
                                        </label>
                                        <select name="variantId" class="form-select" required>
                                            <option value="">-- Chọn sản phẩm và phiên bản --</option>
                                            <option th:each="v : ${variants}" th:value="${v.variantId}"
                                                    th:text="${v.product.productName} + ' - ' + (${v.color != null ? v.color : ''}) + ' ' + (${v.storage != null ? v.storage : ''}) + ' [SKU: ' + ${v.sku} + ']'"></option>
                                        </select>
                                    </div>

                                    <!-- Số lượng -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">
                                            <i class="bi bi-123 text-info me-1"></i> Số lượng chuyển <span class="text-danger">*</span>
                                        </label>
                                        <input type="number" name="quantity" class="form-control" min="1" max="1000" value="1" required>
                                    </div>

                                    <!-- Ghi chú / Lý do điều chuyển -->
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">
                                            <i class="bi bi-chat-left-text me-1"></i> Lý do / Ghi chú điều chuyển
                                        </label>
                                        <textarea name="note" class="form-control" rows="3"
                                                  placeholder="Ví dụ: Điều chuyển gấp phục vụ đơn hàng khách đặt nhận tại shop hoặc cân đối tồn kho..."></textarea>
                                    </div>

                                    <!-- Action Buttons -->
                                    <div class="col-12 d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                        <a th:href="@{/admin/transfers}" class="btn btn-outline-secondary">
                                            <i class="bi bi-x-lg me-1"></i> Quay lại
                                        </a>
                                        <button type="submit" class="btn btn-primary px-4">
                                            <i class="bi bi-check-circle me-1"></i> Xác nhận lập phiếu
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
