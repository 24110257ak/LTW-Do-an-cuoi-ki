<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Banner quảng cáo | TechChain HQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('banners')}"></div>

    <!-- Main Content -->
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/admin-sidebar :: topbar}"></div>

        <div class="container-fluid p-4">
            <!-- Alert message -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Thành công</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1">Banner & Slide Quảng Cáo</h3>
                    <p class="text-muted mb-0">Quản lý các slide banner sự kiện công nghệ hiển thị tại trang chủ</p>
                </div>
                <div>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBannerModal">
                        <i class="bi bi-plus-lg me-1"></i> Thêm banner mới
                    </button>
                </div>
            </div>

            <!-- Banners Table -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Hình ảnh banner</th>
                                    <th>Tiêu đề quảng cáo</th>
                                    <th>Liên kết (URL)</th>
                                    <th>Thứ tự</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${banners == null || banners.isEmpty()}">
                                    <td colspan="7" class="text-center py-5 text-muted">Chưa có banner nào.</td>
                                </tr>
                                <tr th:each="bn : ${banners}">
                                    <td th:text="${bn.bannerId}">1</td>
                                    <td style="width: 180px;">
                                        <img th:src="${bn.imageUrl}" alt="" class="img-fluid rounded border shadow-sm" style="max-height: 60px; object-fit: cover;">
                                    </td>
                                    <td>
                                        <strong class="text-dark" th:text="${bn.title}">iPhone 16 Series ra mắt</strong>
                                    </td>
                                    <td>
                                        <small class="text-muted" th:text="${bn.linkUrl != null ? bn.linkUrl : '#'}">/products/iphone-16</small>
                                    </td>
                                    <td th:text="${bn.displayOrder}">1</td>
                                    <td>
                                        <form th:action="@{/admin/banners/{id}/toggle(id=${bn.bannerId})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm border-0 p-0" title="Bấm để bật/tắt">
                                                <span th:if="${bn.isActive}" class="badge bg-success"><i class="bi bi-check-circle me-1"></i> Hiển thị</span>
                                                <span th:if="${!bn.isActive}" class="badge bg-secondary"><i class="bi bi-x-circle me-1"></i> Ẩn</span>
                                            </button>
                                        </form>
                                    </td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/banners/{id}/delete(id=${bn.bannerId})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa banner này?');">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa banner">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal Thêm Banner -->
<div class="modal fade" id="addBannerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Thêm Banner quảng cáo mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/banners/save}" th:object="${newBanner}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tiêu đề banner <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{title}" class="form-control" placeholder="Ví dụ: Đại tiệc SamFan Galaxy S25 Ultra..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tải lên hình ảnh (Cloudinary) <span class="text-danger">*</span></label>
                        <input type="file" name="imageFile" class="form-control" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Đường dẫn liên kết khi click</label>
                        <input type="text" th:field="*{linkUrl}" class="form-control" placeholder="/products/galaxy-s25-ultra">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Thứ tự ưu tiên hiển thị</label>
                        <input type="number" th:field="*{displayOrder}" class="form-control" value="0">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary fw-bold">Lưu Banner</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
