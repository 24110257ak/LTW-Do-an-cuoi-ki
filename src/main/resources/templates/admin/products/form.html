<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.productId != null ? 'Chỉnh sửa sản phẩm | TechChain HQ' : 'Thêm sản phẩm mới | TechChain HQ'}">Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('products')}"></div>

    <!-- Main Content -->
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/admin-sidebar :: topbar}"></div>

        <div class="container-fluid p-4">
            <!-- Breadcrumb -->
            <div class="mb-4">
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary btn-sm mb-2"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
                <h3 class="fw-bold mb-0" th:text="${product.productId != null ? 'Chỉnh sửa sản phẩm: ' + product.productName : 'Thêm sản phẩm mới'}">Thêm sản phẩm mới</h3>
            </div>

            <!-- Form Card -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4">
                    <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{productId}">
                        <input type="hidden" th:field="*{thumbnailUrl}">
                        <input type="hidden" th:field="*{totalSold}">

                        <div class="row g-4">
                            <!-- Left: Basic info -->
                            <div class="col-lg-8">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{productName}" class="form-control" placeholder="Ví dụ: iPhone 16 Pro Max, Samsung Galaxy S25 Ultra..." required>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Ngành hàng / Danh mục <span class="text-danger">*</span></label>
                                        <select name="categoryId" class="form-select" required>
                                            <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}" th:selected="${product.category != null && product.category.categoryId == c.categoryId}">Điện thoại</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Thương hiệu <span class="text-danger">*</span></label>
                                        <select name="brandId" class="form-select" required>
                                            <option th:each="b : ${brands}" th:value="${b.brandId}" th:text="${b.brandName}" th:selected="${product.brand != null && product.brand.brandId == b.brandId}">Apple</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Giá niêm yết cơ bản (VNĐ) <span class="text-danger">*</span></label>
                                        <input type="number" th:field="*{basePrice}" class="form-control" placeholder="Ví dụ: 34990000" min="0" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Đường dẫn tĩnh (Slug URL)</label>
                                        <input type="text" th:field="*{slug}" class="form-control" placeholder="Tự động tạo từ tên nếu để trống">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Mô tả chi tiết sản phẩm</label>
                                    <textarea th:field="*{description}" class="form-control" rows="6" placeholder="Mô tả các đặc điểm nổi bật, thiết kế, công nghệ..."></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Thông số kỹ thuật (JSON hoặc văn bản)</label>
                                    <textarea th:field="*{specifications}" class="form-control" rows="4" placeholder='{"man_hinh": "6.9 inch OLED", "chip": "Apple A18 Pro", "pin": "4685 mAh"}'></textarea>
                                </div>
                            </div>

                            <!-- Right: Thumbnail & Options -->
                            <div class="col-lg-4">
                                <div class="card bg-light border p-3 rounded-3 mb-3">
                                    <label class="form-label fw-semibold"><i class="bi bi-cloud-arrow-up text-primary me-1"></i> Ảnh đại diện (Cloudinary)</label>
                                    <div class="text-center my-3" th:if="${product.thumbnailUrl != null && !product.thumbnailUrl.isBlank()}">
                                        <img th:src="${product.thumbnailUrl}" alt="Thumbnail" class="img-fluid rounded border bg-white p-2" style="max-height: 180px; object-fit: contain;">
                                    </div>
                                    <input type="file" name="thumbnailFile" class="form-control" accept="image/*">
                                    <small class="text-muted d-block mt-2">Được tự động tải lên và tối ưu qua Cloudinary CDN.</small>
                                </div>

                                <div class="card bg-light border p-3 rounded-3 mb-3">
                                    <div class="form-check form-switch mb-2">
                                        <input class="form-check-input" type="checkbox" role="switch" id="isFeatured" th:field="*{isFeatured}">
                                        <label class="form-check-label fw-semibold" for="isFeatured">Sản phẩm nổi bật (Hot)</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" role="switch" id="isActive" th:field="*{isActive}">
                                        <label class="form-check-label fw-semibold" for="isActive">Kích hoạt mở bán ngay</label>
                                    </div>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary btn-lg fw-bold">
                                        <i class="bi bi-save me-1"></i> Lưu & Quản lý Biến thể
                                    </button>
                                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Hủy bỏ</a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
