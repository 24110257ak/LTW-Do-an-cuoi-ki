# ==============================================================
# SERVER CONFIGURATION
# ==============================================================
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==============================================================
# DATABASE CONFIGURATION (MICROSOFT SQL SERVER)
# ==============================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=electronics_store_chain;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;useUnicode=true;characterEncoding=UTF-8;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================================================
# JPA / HIBERNATE CONFIGURATION
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true

# ==============================================================
# THYMELEAF CONFIGURATION
# ==============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ==============================================================
# SPRING SECURITY & JWT CONFIGURATION
# ==============================================================
# 256-bit Hex secret key for HS256 JWT
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
# Expiration: 24 hours in milliseconds
jwt.expiration=86400000

# ==============================================================
# CLOUDINARY MEDIA CONFIGURATION
# ==============================================================
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# ==============================================================
# SPRING MAIL CONFIGURATION (GỬI MÃ OTP QUA EMAIL)
# ==============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.otp-expiry-minutes=5

# ==============================================================
# MULTIPART FILE UPLOAD LIMITS
# ==============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ==============================================================
# SWAGGER / OPENAPI 3
# ==============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================================================
# LOGGING
# ==============================================================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.vn.iotstar=DEBUG
